services:
  app:
    build:
      context: .
      target: development
    command: npm run dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moderato}:${POSTGRES_PASSWORD:-moderato_dev_password}@db:5432/${POSTGRES_DB:-moderato}?schema=public
      CONTACT_FORM_ENABLED: ${CONTACT_FORM_ENABLED:-false}
      ADMIN_CMS_ENABLED: ${ADMIN_CMS_ENABLED:-false}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-magic_link}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_AUTH_URL: ${ADMIN_AUTH_URL:-}
      ADMIN_AUTH_RESEND_FROM: ${ADMIN_AUTH_RESEND_FROM:-}
      ADMIN_AUTH_RESEND_KEY: ${ADMIN_AUTH_RESEND_KEY:-}
      ADMIN_RATE_LIMIT_SECRET: ${ADMIN_RATE_LIMIT_SECRET:-}
      GALLERY_STORAGE_ENDPOINT: ${GALLERY_STORAGE_ENDPOINT:-}
      GALLERY_STORAGE_REGION: ${GALLERY_STORAGE_REGION:-auto}
      GALLERY_STORAGE_BUCKET: ${GALLERY_STORAGE_BUCKET:-}
      GALLERY_STORAGE_ACCESS_KEY_ID: ${GALLERY_STORAGE_ACCESS_KEY_ID:-}
      GALLERY_STORAGE_SECRET_ACCESS_KEY: ${GALLERY_STORAGE_SECRET_ACCESS_KEY:-}
      GALLERY_STORAGE_PUBLIC_URL: ${GALLERY_STORAGE_PUBLIC_URL:-}
      GALLERY_STORAGE_FORCE_PATH_STYLE: ${GALLERY_STORAGE_FORCE_PATH_STYLE:-false}
      GALLERY_STORAGE_PREFIX: ${GALLERY_STORAGE_PREFIX:-gallery}
      GALLERY_CLEANUP_SECRET: ${GALLERY_CLEANUP_SECRET:-}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moderato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moderato_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-moderato}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_node_modules:
  postgres_data:
