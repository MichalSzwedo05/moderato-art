version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      all-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      all-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      postgres-major:
        applies-to: version-updates
        patterns: ["postgres"]
        update-types: [major]
      all-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      all-security-updates:
        applies-to: security-updates
        patterns: ["*"]
