services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CONTACT_FORM_ENABLED: ${CONTACT_FORM_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FORM_RECIPIENT: ${CONTACT_FORM_RECIPIENT:-}
      CONTACT_FORM_RESEND_FROM: ${CONTACT_FORM_RESEND_FROM:-}
      CONTACT_RATE_LIMIT_SECRET: ${CONTACT_RATE_LIMIT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      ADMIN_CMS_ENABLED: ${ADMIN_CMS_ENABLED:-false}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-magic_link}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_EXTRA_USERS: ${ADMIN_EXTRA_USERS:-}
      ADMIN_AUTH_URL: ${ADMIN_AUTH_URL:-}
      ADMIN_AUTH_RESEND_FROM: ${ADMIN_AUTH_RESEND_FROM:-}
      ADMIN_AUTH_RESEND_KEY: ${ADMIN_AUTH_RESEND_KEY:-}
      ADMIN_RATE_LIMIT_SECRET: ${ADMIN_RATE_LIMIT_SECRET:-}
      GALLERY_CLEANUP_SECRET: ${GALLERY_CLEANUP_SECRET:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_RANGE: ${GOOGLE_SHEETS_RANGE:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?SITE_DOMAIN must be set}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - database

  db:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE must be set}
    profiles: ["migration"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL must be set}
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set}
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  frontend:
  database:
    internal: true

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
